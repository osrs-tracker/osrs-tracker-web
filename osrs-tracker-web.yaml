apiVersion: v1
kind: Namespace
metadata:
  name: osrs-tracker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrs-tracker-web
  namespace: osrs-tracker
  labels:
    app: osrs-tracker-web
spec:
  replicas: 2
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: osrs-tracker-web
  template:
    metadata:
      labels:
        app: osrs-tracker-web
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9090'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: osrs-tracker-web
          image: freekmencke/osrs-tracker-web@sha256:75cd8834b3d4d11b9b9994a941ae062424a282f7c9c8d6925e198672f0960d7d
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: osrs-tracker.freekmencke.com
            # Traefik sets these and overwrites any sent by clients.
            - name: TRUST_PROXY_HEADERS
              value: x-forwarded-for,x-forwarded-host,x-forwarded-port,x-forwarded-proto,x-forwarded-server
            # Server-side rendering calls the API in-cluster, not through the router and Traefik.
            - name: API_INTERNAL_URL
              value: http://osrs-tracker-api-service.osrs-tracker:3000
          ports:
            - containerPort: 8080
            - containerPort: 9090
          resources:
            # Measured idle at ~2m CPU / 50-75Mi on 2026-10-04. No CPU limit: throttling would slow down SSR renders.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            # The image's `node` user, numeric so the kubelet can verify it isn't root
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Checks the main app, so a pod whose app stopped serving is taken out of the service
          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
            periodSeconds: 5
          # Only restarts a hung process
          livenessProbe:
            httpGet:
              path: /healthy
              port: 9090
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthy
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Keep serving until Traefik has dropped the terminating pod, otherwise in-flight requests get a 502/504
            preStop:
              sleep:
                seconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: osrs-tracker-web
  namespace: osrs-tracker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: osrs-tracker-web
---
apiVersion: v1
kind: Service
metadata:
  name: osrs-tracker-web-service
  namespace: osrs-tracker
spec:
  selector:
    app: osrs-tracker-web
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osrs-tracker-web-ingress
  namespace: osrs-tracker
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    # The Middlewares below: per-client-IP rate limits, Forwarded header stripping, then compression (last, so rejected
    # requests cost none).
    traefik.ingress.kubernetes.io/router.middlewares: osrs-tracker-osrs-tracker-web-ratelimit@kubernetescrd,osrs-tracker-osrs-tracker-web-inflight@kubernetescrd,osrs-tracker-osrs-tracker-web-strip-forwarded@kubernetescrd,osrs-tracker-osrs-tracker-web-compress@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - osrs-tracker.freekmencke.com
      secretName: osrs-tracker-web-tls
  rules:
    - host: osrs-tracker.freekmencke.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: osrs-tracker-web-service
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-web-ratelimit
  namespace: osrs-tracker
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 250
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-web-inflight
  namespace: osrs-tracker
spec:
  inFlightReq:
    amount: 200
---
# Traefik passes a client-sent RFC 7239 Forwarded header through unchanged (it only rewrites X-Forwarded-*), so drop it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-web-strip-forwarded
  namespace: osrs-tracker
spec:
  headers:
    customRequestHeaders:
      Forwarded: ''
---
# Compresses text for browsers (bodies of 1024 bytes and up): pages, bundles, sitemaps. Not the PNG/GIF icons or the
# WOFF2 font, which are compressed already. Browsers list encodings without weights, so Traefik picks by `encodings`
# order; its default (gzip, br, zstd) gave every browser gzip. Brotli first: `/` is 20 KB in br, 23 KB in gzip and
# 24 KB in Traefik's zstd, so zstd is left out.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-web-compress
  namespace: osrs-tracker
spec:
  compress:
    encodings: [br, gzip]
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - text/plain
      - application/xml
      - application/manifest+json
