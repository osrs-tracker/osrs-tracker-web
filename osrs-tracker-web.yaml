apiVersion: v1
kind: Namespace
metadata:
  name: osrs-tracker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrs-tracker-web
  namespace: osrs-tracker
  labels:
    app: osrs-tracker-web
spec:
  replicas: 2
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: osrs-tracker-web
  template:
    metadata:
      labels:
        app: osrs-tracker-web
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9090'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: osrs-tracker-web
          image: freekmencke/osrs-tracker-web@sha256:a5cb26e9ee9a499daba7bfd2063587d54b1ab85059b36f5e5e1bb82a1868716b
          imagePullPolicy: Always
          env:
            - name: HOST
              value: osrs-tracker.freekmencke.com
            # Traefik sets these and overwrites any sent by clients.
            - name: TRUST_PROXY_HEADERS
              value: x-forwarded-for,x-forwarded-host,x-forwarded-port,x-forwarded-proto,x-forwarded-server
          ports:
            - containerPort: 8080
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthy
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthy
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: osrs-tracker-web-service
  namespace: osrs-tracker
spec:
  selector:
    app: osrs-tracker-web
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osrs-tracker-web-ingress
  namespace: osrs-tracker
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    # Per-client-IP rate limits and Forwarded header stripping: the Middlewares below.
    traefik.ingress.kubernetes.io/router.middlewares: osrs-tracker-osrs-tracker-web-ratelimit@kubernetescrd,osrs-tracker-osrs-tracker-web-inflight@kubernetescrd,osrs-tracker-osrs-tracker-web-strip-forwarded@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - osrs-tracker.freekmencke.com
      secretName: osrs-tracker-web-tls
  rules:
    - host: osrs-tracker.freekmencke.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: osrs-tracker-web-service
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-web-ratelimit
  namespace: osrs-tracker
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 250
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-web-inflight
  namespace: osrs-tracker
spec:
  inFlightReq:
    amount: 200
---
# Traefik passes a client-sent RFC 7239 Forwarded header through unchanged (it only rewrites X-Forwarded-*), so drop it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-web-strip-forwarded
  namespace: osrs-tracker
spec:
  headers:
    customRequestHeaders:
      Forwarded: ''
