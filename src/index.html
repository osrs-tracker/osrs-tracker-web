<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>OSRS Tracker</title>

    <!-- PWA -->
    <meta name="theme-color" content="#0F172A" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- End PWA -->

    <!-- Google tag (gtag.js): loaded only once the visitor allows its cookies (ConsentService); before a choice, events
         wait in dataLayer, and after Don't allow none are pushed. The ID and storage key are config.gaMeasurementId and
         StorageKey.AnalyticsConsent -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      const analyticsConsent = localStorage.getItem('analytics-consent');
      const analyticsAllowed = analyticsConsent === 'granted';
      // The server renders the consent banner in every page: hide it before the first paint from visitors who chose
      // before, until ConsentService removes it. A style element of its own, as the build's critical CSS would drop a
      // rule in styles.css that no element matches at build time
      if (analyticsConsent === 'granted' || analyticsConsent === 'denied') {
        const style = document.createElement('style');
        style.id = 'consent-chosen';
        style.textContent = 'consent-banner { display: none; }';
        document.head.appendChild(style);
      }
      gtag('consent', 'default', {
        analytics_storage: analyticsAllowed ? 'granted' : 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
      });
      if (analyticsAllowed) {
        const tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-PSQN8ELKNJ';
        document.head.appendChild(tag);
      }

      gtag('config', 'G-PSQN8ELKNJ', {
        send_page_view: false,
        cookie_flags: 'SameSite=None;Secure',
        ...(location.hostname === 'localhost' ? { debug_mode: true } : {}),
        ...(localStorage.getItem('traffic_type') ? { traffic_type: localStorage.getItem('traffic_type') } : {}),
      });
    </script>
    <!-- End Google tag -->

    <!-- Load theme -->
    <script>
      const darkModeSetting = localStorage.getItem('dark-mode');

      const darkModeEnabled =
        darkModeSetting !== null ? darkModeSetting === 'true' : matchMedia('(prefers-color-scheme: dark)').matches;

      document.documentElement.classList.toggle('dark', darkModeEnabled);
      // The page ground (slate-900 / slate-100), as ThemeService sets it on toggle
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', darkModeEnabled ? '#0f172a' : '#f1f5f9');

      gtag('event', 'load_theme', { theme: darkModeEnabled ? 'dark' : 'light' });
    </script>
    <!-- End Load Theme -->

    <link href="favicon.png" rel="icon" media="(prefers-color-scheme: light)" />
    <link href="favicon-dark.png" rel="icon" media="(prefers-color-scheme: dark)" />
    <link href="/assets/pwa/icon-512x512.png" rel="apple-touch-icon" sizes="512x512" />
    <link href="/assets/pwa/icon-192x192.png" rel="apple-touch-icon" sizes="192x192" />

    <!-- The URL must match the @font-face one in styles/tailwind/base.css -->
    <link rel="preload" href="/assets/fonts/SOLIX-Variable.woff2?v=3.00" as="font" type="font/woff2" crossorigin />

    <!-- crossorigin for the HttpClient (CORS) requests right after hydration; none for the Wiki's <img> icons -->
    <link rel="preconnect" href="https://prices.runescape.wiki" crossorigin />
    <link rel="preconnect" href="https://runescape-api.freekmencke.com" crossorigin />
    <link rel="preconnect" href="https://oldschool.runescape.wiki" />
  </head>
  <body class="antialiased text-text bg-ground">
    <app-root ngCspNonce="CSP_NONCE_PLACEHOLDER"></app-root>
  </body>
</html>
