<div class="container mx-auto mt-4 mb-8 px-4 grid lg:grid-cols-3 2xl:grid-cols-4 gap-8">
  <item-detail-widget
    [itemDetail]="itemDetail().item"
    [latestPrices]="itemDetail().latestPrices"
    [dailyVolume]="itemDetail().dailyVolume"
  ></item-detail-widget>

  <item-analytics
    class="lg:col-span-2 2xl:col-span-3"
    [itemDetail]="itemDetail().item"
    [latestPrices]="itemDetail().latestPrices"
    [timeSeriesToday]="itemDetail().timeSeriesToday"
  ></item-analytics>
</div>
