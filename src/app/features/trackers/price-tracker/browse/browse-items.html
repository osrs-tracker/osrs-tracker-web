<div class="max-w-page mx-auto px-4 sm:px-6 pt-4">
  <a routerLink="/trackers/price" class="link inline-flex items-center gap-1.5 min-h-11">
    <svg
      class="size-4.5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <line x1="19" y1="12" x2="5" y2="12" />
      <polyline points="11 6 5 12 11 18" />
    </svg>
    Price Tracker
  </a>
</div>

@if (items(); as items) {
  <header class="max-w-page mx-auto flex flex-col gap-1 px-4 sm:px-6 pt-2">
    <h1 class="text-2xl sm:text-3xl font-bold text-strong">{{ heading() }}</h1>
    <p class="text-muted">{{ items.length }} {{ items.length === 1 ? 'item' : 'items' }}, by name</p>
  </header>

  <main class="max-w-page mx-auto flex flex-col gap-6 px-4 sm:px-6 pt-6 pb-18">
    <nav letter-bar [current]="letter()"></nav>

    <section class="rounded-2xl bg-card overflow-hidden" [attr.aria-label]="heading()">
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3">
        @for (item of items; track item.id) {
          <a item-row [routerLink]="['/trackers/price', item.id]" [item]="item"></a>
        }
      </div>
    </section>
  </main>
} @else {
  <main class="max-w-page mx-auto flex flex-col gap-8 px-4 sm:px-6 pt-12 pb-18">
    <status-panel
      icon="search"
      [heading]="'There’s no letter “' + letter() + '”'"
      message="Items are listed by the first letter of their name. Pick one below."
    />
    <nav letter-bar></nav>
  </main>
}
