<div class="container mx-auto my-4 px-4 grid lg:grid-cols-3 2xl:grid-cols-4 gap-8">
  <player-detail-widget [playerDetail]="playerDetail()">
    @if (todayResource.error()) {
      <load-error
        panel
        source="player-hiscore"
        message="Couldn't load the current hiscores."
        (retry)="todayResource.reload()"
      />
    } @else {
      <player-skills [hiscore]="today()" />
      <!-- in one column the activities would push the progress far down, so they're collapsed there -->
      <button
        class="lg:hidden button--default button--rounded"
        [attr.aria-expanded]="showActivities()"
        (click)="showActivities.set(!showActivities())"
      >
        {{ showActivities() ? 'Hide' : 'Show' }} clues, raids & bosses
      </button>
      <div class="flex-col gap-4 lg:flex" [class.flex]="showActivities()" [class.hidden]="!showActivities()">
        <player-clues [hiscore]="today()" />
        <player-raids [hiscore]="today()" />
        <player-bosses [hiscore]="today()" />
      </div>
    }
  </player-detail-widget>

  <section class="lg:col-span-2 2xl:col-span-3">
    @if (firstHistoryPage.error()) {
      <section class="flex flex-col gap-4">
        <h1 class="flex items-center h-9 text-2xl font-bold text-slate-900 dark:text-white">Progress</h1>
        <load-error
          panel
          source="player-history"
          message="Couldn't load the logs."
          (retry)="firstHistoryPage.reload()"
        />
      </section>
    } @else {
      <player-logs [playerDetail]="playerDetail()" [today]="today()" [history]="history()" />

      @if (hasMoreEntries()) {
        <footer class="flex justify-center mt-4">
          @if (loadingMore()) {
            <spinner class="mt-2.5 mb-3" />
          } @else if (loadMoreFailed()) {
            <load-error source="player-history-more" message="Couldn't load more data." (retry)="loadMore()" />
          } @else {
            <button class="button--default button--rounded px-16" (click)="loadMore()">Load more data</button>
          }
        </footer>
      }
    }
  </section>
</div>
