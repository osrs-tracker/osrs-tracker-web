<!-- Sized like `osrs-news-card`, including its half-width card on phones -->
<article class="flex flex-col h-full rounded-2xl bg-card overflow-hidden">
  <skeleton class="w-full rounded-none" [style.aspect-ratio]="628 / 354" />
  <div class="flex flex-col grow p-4 max-sm:px-3 max-sm:pt-2.5 max-sm:pb-3">
    <div class="flex justify-between gap-2 mb-2 max-sm:mt-1 max-sm:mb-0 py-0.5">
      <skeleton class="h-4 w-28 max-sm:w-24" />
      <skeleton class="h-4 w-20 max-sm:hidden" />
    </div>
    <div class="flex flex-col max-sm:order-first gap-2 max-sm:gap-1.5 mb-2 max-sm:mb-0 py-1 max-sm:py-0.75">
      <skeleton class="h-4 w-full" />
      <skeleton class="h-4 w-36 max-sm:w-20" />
    </div>
    <div class="flex flex-col gap-2 py-1 max-sm:hidden">
      <skeleton class="h-4 w-full" />
      <skeleton class="h-4 w-44" />
    </div>
  </div>
</article>
