<!-- Sized like `osrs-news-card`, including its compact card on phones and tablets -->
<article class="flex flex-col h-full rounded-2xl bg-card overflow-hidden">
  <skeleton class="w-full rounded-none" [style.aspect-ratio]="628 / 354" />
  <div class="flex flex-col grow p-4 compact:px-3 compact:pt-2.5 compact:pb-3">
    <div class="flex justify-between gap-2 mb-2 compact:mt-1 compact:mb-0 py-0.5">
      <skeleton class="h-4 w-28 compact:w-24" />
      <skeleton class="h-4 w-20 compact:hidden" />
    </div>
    <div class="flex flex-col compact:order-first gap-2 compact:gap-1.5 mb-2 compact:mb-0 py-1 compact:py-0.75">
      <skeleton class="h-4 w-full" />
      <skeleton class="h-4 w-36 compact:w-20" />
    </div>
    <div class="flex flex-col gap-2 py-1 compact:hidden">
      <skeleton class="h-4 w-full" />
      <skeleton class="h-4 w-44" />
    </div>
  </div>
</article>
