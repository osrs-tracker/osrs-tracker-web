<!-- Compact on phones (a 2×2 grid) and tablets (four in a row): the title first, three lines high (two cut most
     titles at 375px; a fixed height lines the dates up across cards), then a one-line short date and category, without
     the excerpt -->
<article
  class="group relative flex flex-col h-full rounded-2xl bg-card overflow-hidden hover:bg-row focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-accent"
>
  <img class="w-full bg-row object-cover" [ngSrc]="imageSrc()" alt="" [width]="628" [height]="354" priority />
  <div class="flex flex-col grow min-w-0 p-4 compact:px-3 compact:pt-2.5 compact:pb-3">
    <div
      class="flex justify-between gap-2 mb-2 compact:block compact:mt-1 compact:mb-0 compact:truncate text-sm/5 text-muted"
    >
      <span class="compact:hidden">{{ osrsNewsItem().pubDate | date: 'MMMM dd, yyyy' }}</span>
      <span class="sm:max-md:hidden xl:hidden">{{ osrsNewsItem().pubDate | date: 'd MMM' }} · </span>
      <span>{{ osrsNewsItem().category }}</span>
    </div>
    <h3
      class="compact:order-first mb-2 compact:mb-0 compact:min-h-16.5 text-lg/6 compact:text-base/5.5 font-bold line-clamp-2 compact:line-clamp-3"
    >
      <a
        class="text-strong group-hover:text-accent after:absolute after:inset-0 focus-visible:outline-none"
        [href]="osrsNewsItem().link"
        target="_blank"
        rel="noopener"
        [innerHTML]="osrsNewsItem().title"
      ></a>
    </h3>
    <p class="compact:hidden line-clamp-2" [innerHTML]="osrsNewsItem().description"></p>
  </div>
</article>
