<!-- On phones half width in a 2×2 grid: the title first, then a one-line short date and category, without the excerpt -->
<article
  class="group relative flex flex-col h-full rounded-2xl bg-card overflow-hidden hover:bg-row focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-accent"
>
  <img class="w-full bg-row object-cover" [ngSrc]="imageSrc()" alt="" [width]="628" [height]="354" priority />
  <div class="flex flex-col grow min-w-0 p-4 max-sm:px-3 max-sm:pt-2.5 max-sm:pb-3">
    <div
      class="flex justify-between gap-2 mb-2 max-sm:block max-sm:mt-1 max-sm:mb-0 max-sm:truncate text-sm/5 text-muted"
    >
      <span class="max-sm:hidden">{{ osrsNewsItem().pubDate | date: 'MMMM dd, yyyy' }}</span>
      <span class="sm:hidden">{{ osrsNewsItem().pubDate | date: 'd MMM' }} · </span>
      <span>{{ osrsNewsItem().category }}</span>
    </div>
    <h3
      class="max-sm:order-first mb-2 max-sm:mb-0 max-sm:min-h-11 text-lg/6 max-sm:text-base/5.5 font-bold line-clamp-2"
    >
      <a
        class="text-strong group-hover:text-accent after:absolute after:inset-0 focus-visible:outline-none"
        [href]="osrsNewsItem().link"
        target="_blank"
        rel="noopener"
        [innerHTML]="osrsNewsItem().title"
      ></a>
    </h3>
    <p class="max-sm:hidden line-clamp-2" [innerHTML]="osrsNewsItem().description"></p>
  </div>
</article>
