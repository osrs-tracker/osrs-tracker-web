<article class="flex flex-col h-full rounded-2xl bg-card">
  <img
    class="rounded-t-2xl cursor-pointer"
    [ngSrc]="imageSrc()"
    [alt]="osrsNewsItem().title"
    [width]="628"
    [height]="354"
    (click)="openLink(osrsNewsItem().link)"
    priority
  />
  <div class="flex flex-col grow p-4">
    <div class="flex justify-between text-muted mb-2 font-light">
      <small>{{ osrsNewsItem().pubDate | date: 'MMMM dd, yyyy' }}</small>
      <small>{{ osrsNewsItem().category }}</small>
    </div>
    <h3 class="font-bold mb-2 truncate" [innerHTML]="osrsNewsItem().title"></h3>
    <div class="line-clamp-2 mb-2" [innerHTML]="osrsNewsItem().description"></div>
    <div class="mt-auto">
      <a class="link" [href]="osrsNewsItem().link" target="_blank">
        Read more
        <span class="absolute overflow-hidden w-px h-px">&ngsp;about "{{ osrsNewsItem().title }}".</span>
      </a>
    </div>
  </div>
</article>
