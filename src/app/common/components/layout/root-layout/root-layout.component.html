<div class="min-h-screen flex flex-col sa-t sa-l sa-r">
  <!-- Sticky from sm up only: on phones the two-row nav would take too much of the screen -->
  <nav class="relative sm:sticky top-0 z-9999 text-strong bg-ground border-b border-line">
    <div
      class="max-w-page mx-auto flex flex-wrap items-center gap-x-4 gap-y-1 px-4 pt-3 pb-1.5 sm:gap-6 sm:px-6 sm:py-4"
    >
      <a class="font-bold text-xl hover:text-accent-hover" routerLink="/">OSRS Tracker</a>

      <div class="grow"></div>

      <!-- On phones the links wrap to a second row of three equal-width tabs, edge to edge -->
      <ul class="max-sm:order-3 max-sm:basis-full max-sm:grow max-sm:-mx-4 grid grid-cols-3 sm:flex sm:gap-5 font-bold">
        @for (route of routes; track route.path) {
          <li class="flex">
            <a
              class="relative flex grow items-center justify-center max-sm:min-h-11 whitespace-nowrap max-xs:text-sm hover:text-accent-hover aria-[current=page]:text-accent max-sm:aria-[current=page]:after:absolute max-sm:aria-[current=page]:after:inset-x-0 max-sm:aria-[current=page]:after:-bottom-1.5 max-sm:aria-[current=page]:after:h-0.5 max-sm:aria-[current=page]:after:rounded-xs max-sm:aria-[current=page]:after:bg-accent"
              [routerLink]="route.path"
              routerLinkActive
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: route.path === '/' }"
              >{{ route.name }}</a
            >
          </li>
        }
      </ul>

      <dark-mode />
    </div>

    @if (hasOngoingRequests()) {
      <!-- On the nav's bottom border; on phones fixed to the screen top, where it can't read as the tab underline -->
      <div
        class="absolute inset-x-0 -bottom-px max-sm:fixed max-sm:top-0 max-sm:bottom-auto h-0.5 overflow-hidden animate-show-delayed"
        role="progressbar"
        aria-label="Loading"
      >
        <span class="block w-2/5 h-0.5 bg-accent animate-loading-sweep motion-reduce:animate-none motion-reduce:w-full">
        </span>
      </div>
    }
  </nav>

  <main class="relative">
    <!-- content -->
    <router-outlet />
  </main>

  <footer class="mt-auto bg-ground border-t border-line">
    <div
      class="max-w-page mx-auto flex flex-wrap items-center justify-between gap-x-7 gap-y-3 px-4 sm:px-6 py-4 text-sm leading-5 text-muted"
    >
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5">
        <span class="font-bold">&copy; OSRS Tracker 2019 - {{ currentYear }}</span>
        <span class="max-sm:hidden w-px h-3.5 bg-border" aria-hidden="true"></span>
        <span>This content is not endorsed by or affiliated with Jagex.</span>
      </div>

      <div class="flex flex-wrap gap-x-5 gap-y-1.5 text-accent">
        <a class="hover:text-accent-hover" routerLink="/about/changelog">Changelog</a>
        <a class="hover:text-accent-hover" routerLink="/about/privacy">Privacy</a>
        <a class="hover:text-accent-hover" routerLink="/about/terms">Terms</a>
        <a
          class="hover:text-accent-hover"
          href="https://github.com/osrs-tracker/osrs-tracker-web"
          target="_blank"
          rel="noopener"
          >GitHub</a
        >
      </div>
    </div>

    <div class="sa-b"><!-- spacing for safe-area-inset --></div>
  </footer>
</div>
