# zizmor's configuration (.github/workflows/zizmor.yml runs it on every pull request and push to main). Every ignore
# says why; anything else zizmor finds fails the check.
rules:
  unpinned-uses:
    config:
      policies:
        # GitHub's own actions stay on major tags: security backports reach us through the tag, as checkout's fork-PR
        # guard did on 2026-07-20. Everything else keeps zizmor's implicit `"*": hash-pin` (full SHAs, which Dependabot
        # bumps with their version comment).
        'actions/*': ref-pin

  dangerous-triggers:
    ignore:
      # CD deploys once CI passes on main. Its `if:` lets only CI's push runs on main from this repository through, so
      # pull requests and forks never start a deploy; it checks out main, builds a commit that is on main and takes no
      # artifacts, outputs or branch names from the CI run, only its head SHA, workflow id and title (the run name).
      # Turning it into a job of CI (zizmor's suggestion) would redesign the deploy: decide that on its own, not to
      # quiet a linter.
      - deploy.yml

  self-repository:
    ignore:
      # `uses: $/...` (GitHub, 2026-07-30) isn't understood by actionlint yet (1.7.12 rejects it), and every local
      # action here runs from a checkout of the same repository's own commits, so `./` loads nothing a step fetched
      # from elsewhere. Revisit when actionlint and Dependabot support it.
      - deploy.yml
      - nodejs.yml
