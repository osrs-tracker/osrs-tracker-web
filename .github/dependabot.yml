# Security updates only for npm: open-pull-requests-limit 0 disables version updates, while Dependabot security updates
# (enabled in the repository settings) still use this configuration. Other npm updates are done by hand; GitHub Actions
# and the Docker base image get version updates below.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # Angular packages must stay on the same version
      angular:
        applies-to: security-updates
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      # hiscores peer-depends on models, so they must be bumped together
      osrs-tracker:
        applies-to: security-updates
        patterns: ['@osrs-tracker/*']

  # Third-party actions are pinned to commit SHAs, which makes bumping them by hand the error-prone path: Dependabot
  # moves the SHA and its version comment together. `/` covers only the workflows, not the composite actions.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # One PR per action across both folders, not one per folder (setup-node is in both)
      actions:
        patterns: ['*']
        group-by: dependency-name
    commit-message:
      prefix: ci

  # The base image is pinned by digest, so this opens a PR when node:24-alpine is rebuilt (Node patches, Alpine fixes)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Node majors also need CI's setup-node and engines bumped: do them by hand
      - dependency-name: node
        update-types: [version-update:semver-major]
