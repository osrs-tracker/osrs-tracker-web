name: CD
# Titled like the CI run that started it, instead of every run being called "CD"
run-name: ${{ github.event.workflow_run.display_title }}

# Deploys main once CI passes on it: builds and pushes the image, then commits its digest to osrs-tracker-web.yaml on
# main. Flux in the cluster applies that commit and reports it as the `Flux / sync` commit status; nothing here has
# cluster access. The digest commit is pushed with the DEPLOY_KEY deploy key, the only bypass of main's PR rule.
# Rolling back: "Roll back" in docs/runbook.md.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']

permissions: {}

jobs:
  deploy:
    # Pushes to main only: a pull request from a fork's branch named main also matches `branches`
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, never cancelled halfway. A newer queued run replaces an older queued one, which is why a run
    # deploys the newest commit on main that passed CI, not only its own.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      statuses: read
    env:
      IMAGE: freekmencke/osrs-tracker-web
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        name: Pick the commit to deploy
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          # Files that don't end up in the image: a change to only these needs no new image. Flux applies
          # osrs-tracker-web.yaml by itself.
          # CHANGELOG.md too: /about/changelog fetches it from GitHub's main branch at runtime, so a changelog-only
          # commit is live without a deploy
          NOT_IN_IMAGE: '^(osrs-tracker-web\.yaml|public/sitemap[^/]*\.xml|docs/.*|\.claude/.*|\.github/.*|CLAUDE\.md|README\.md|CHANGELOG\.md|LICENSE|\.gitignore)$'
        run: .github/scripts/deploy-plan.sh

      - if: steps.plan.outputs.deploy == 'true'
        uses: ./.github/actions/setup-deps

      # What predocker:build runs, so the regenerated sitemaps can be committed with the digest
      - if: steps.plan.outputs.deploy == 'true'
        run: npm run sitemap && npm run icons

      - if: steps.plan.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.plan.outputs.deploy == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: image
        if: steps.plan.outputs.deploy == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.plan.outputs.sha }}

      # Checked out only now, so the key isn't on disk while dependencies install and build
      - if: steps.plan.outputs.deploy == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          path: .deploy
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - id: commit
        if: steps.plan.outputs.deploy == 'true'
        name: Commit the digest and sitemaps to main
        working-directory: .deploy
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.plan.outputs.sha }}
        run: .github/scripts/deploy-commit.sh

      - if: steps.commit.outputs.sha
        name: Wait for Flux to deploy it
        # main's copy of the script: the root has the commit being deployed checked out, which may predate it
        working-directory: .deploy
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: .github/scripts/deploy-wait-flux.sh

      - if: steps.commit.outputs.sha
        name: Smoke test the site
        working-directory: .deploy # main's copy of the script, as above
        run: .github/scripts/deploy-smoke-test.sh
