name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  # Build and test only run when something they depend on changed since the previous push, so commits like a deploy
  # digest or docs skip them. Skipped jobs still satisfy the required checks; a workflow-level `paths` filter wouldn't.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Check for source or dependency changes
        env:
          # A new push to a PR compares with the previous push, not the base branch, so a digest commit doesn't rerun
          # them for the PR's earlier source changes
          BEFORE:
            ${{ (github.event_name == 'push' || github.event.action == 'synchronize') && github.event.before ||
            github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! files=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null); then
            echo "No previous commit to compare with, running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Changed files:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -v -E '^src/sitemap[^/]*\.xml$' \
            | grep -q -E '^(src/|scripts/|\.github/|package(-lock)?\.json$|angular\.json$|tsconfig[^/]*\.json$|\.postcssrc\.json$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skipping is only safe if build and test passed (or were safely skipped) on the commit compared with;
          # otherwise a docs-only push after a failed build would turn the PR green
          previous=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?filter=latest&per_page=100" \
            --jq '[.check_runs[] | select(.name == "build" or .name == "test") | "\(.name)=\(.conclusion)"] | sort | join(" ")' \
            2>/dev/null || true)
          if [ "$previous" = "build=success test=success" ] || [ "$previous" = "build=skipped test=skipped" ]; then
            echo "No source or dependency changes and $BEFORE passed ($previous), skipping build and test."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "No source or dependency changes, but $BEFORE didn't pass build and test (${previous:-no results}), running them."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run lint
      - run: npm run prettier:ci

  build:
    needs: changes
    # `!cancelled()` runs it when `changes` itself fails, so a broken check can't skip the build
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run build

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
      - run: npm run test
