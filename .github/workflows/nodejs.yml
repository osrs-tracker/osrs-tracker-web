name: CI

on:
  push:
    branches: ['main']
    # Deploy commits (and reverting them to roll back) only change these, which Flux applies by itself, so they need no
    # CI run, and with no CI run there's no deploy run to skip. A push skips only when every file matches. Never on
    # pull_request: the required checks would never report on a PR that only changes these.
    paths-ignore: ['osrs-tracker-web.yaml', 'public/sitemap*.xml']
  pull_request:
    branches: ['main']

# Read-only unless a job asks for more: build and test run code from every installed package, so they get a token that
# can't push or approve pull requests, whatever the repository's default is
permissions:
  contents: read

jobs:
  # Build and test only run when something they depend on changed since the previous push, so commits like a deploy
  # digest or docs skip them. Skipped jobs still satisfy the required checks; a workflow-level `paths` filter wouldn't.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Check for source or dependency changes
        env:
          # A new push to a PR compares with the previous push, not the base branch, so a digest commit doesn't rerun
          # them for the PR's earlier source changes
          BEFORE:
            ${{ (github.event_name == 'push' || github.event.action == 'synchronize') && github.event.before ||
            github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/ci-changes.sh

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository]
      - run: npm run lint
      - run: npm run prettier:ci
      # Unused files, exports and dependencies; what it can't see is in knip.jsonc
      - run: npx knip
      # Copy-pasted code in src/ (.jscpd.json): fails when more than 1% of the lines are duplicated, the specs and test
      # data left out
      - run: npx jscpd
      # The workflows' scripts and Claude Code's hooks and skill scripts. ShellCheck comes with GitHub's Ubuntu runners.
      - run: shellcheck .github/scripts/*.sh .claude/hooks/*.sh .claude/skills/*/*.sh

  # Local links and #anchors in the Markdown, on every run as docs-only changes skip build and test. `--hidden` takes in
  # `.claude/` and `.github/`; `--offline` leaves out external URLs, so other sites can't make it flaky.
  links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --hidden --include-fragments --no-progress './**/*.md'
          fail: true

  # Licences of the runtime dependencies a pull request adds or bumps (the action's default `fail-on-scopes`), so a
  # copyleft one (AGPL in particular) doesn't slip in unseen. No checkout: it compares the manifests through GitHub's
  # API. Not a required check: a failure is for the maintainer to judge. The list is what the tree held on 2026-10-18
  # (`npm sbom`), MPL-2.0 included: file-level copyleft that satori and @resvg/resvg-wasm use unmodified.
  # DevDependencies aren't checked. Allow a single package with `allow-dependencies-licenses: pkg:npm/<name>`. A missing
  # licence is reported, not failed; a non-SPDX one fails. No `deny-licenses` (deprecated) and no vulnerability check.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          license-check: true
          vulnerability-check: false
          allow-licenses: >-
            MIT, MIT-0, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, MPL-2.0, Unlicense

  build:
    needs: changes
    # `!cancelled()` runs it when `changes` itself fails, so a broken check can't skip the build
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository]
      - run: npm run build

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository]
      - run: npm run test
